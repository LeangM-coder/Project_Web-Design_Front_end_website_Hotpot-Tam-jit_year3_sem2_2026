<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="Order_page.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <title>Order</title>
</head>
<body>

<header class="navbar">
  <nav>
    <div class="logo">
      <div class="name">
        <h2>HOTPOT TAM JIT</h2>
      </div>
    </div>

    <div class="pages" id="navbar-pages">
      <ul>
        <li><a href="../Home-Page/Homepage.html" class="nav-link">Home</a></li>
        <li><a href="../Customize-Page/Customized.html" class="nav-link">Customized</a></li>
        <li><a href="../Order_Page/Order_page.html" class="nav-link active">Order</a></li>
        <li><a href="../Card-Page/Cart.html" class="nav-link">Cart</a></li>
      </ul>
    </div>

    <div class="profile">
      <a href="../Profile-Page/login.html">
        <i class="fa-regular fa-user"></i>
      </a>
    </div>

    <div class="hamburger" id="hamburger-menu">
      <i class="fa-solid fa-bars"></i>
    </div>
  </nav>

  <div class="sidebar" id="sidebar-nav">
    <div class="sidebar-header">
      <span class="sidebar-title">Menu</span>
      <span class="sidebar-close" id="sidebar-close">&times;</span>
    </div>

    <ul>
      <li><a href="../Home-Page/Homepage.html" class="nav-link">Home</a></li>
      <li><a href="../Customize-Page/Customized.html" class="nav-link">Customized</a></li>
      <li><a href="../Order_Page/Order_page.html" class="nav-link active">Order</a></li>
      <li><a href="../Card-Page/Cart.html" class="nav-link">Cart</a></li>
      <li><a href="../Profile-Page/login.html" class="nav-link">Profile</a></li>
    </ul>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>
</header>

<main class="container">
  <div class="title">
    <h1>Order Your Hotpot</h1>
  </div>

  <h1 class="title">Set Hotpot-Sea Food</h1>

  <div class="top-section">
    <div class="hotpot-image">
      <img src="https://external-preview.redd.it/bought-a-meat-slicer-to-cut-paper-thin-slices-what-cut-of-v0-4F5_fSPXvyon4cGS99wW1wLFzCkeqfCIUcPDOrbtpYI.jpg?auto=webp&s=f3e42b2030b95ab96f0490bec71b94001a6c9234" alt="Hotpot" />
    </div>

    <div class="spice-box">
      <h2>Spice Level</h2>
      <p>Choose your preferred spice level</p>

      <div class="spice-grid">
        <button class="spice-btn" onclick="selectSpice('Mild', this)">
          <b>Mild</b><br />
          <small>Gentle heat</small>
        </button>

        <button class="spice-btn" onclick="selectSpice('Medium', this)">
          <b>Medium</b><br />
          <small>Medium heat</small>
        </button>

        <button class="spice-btn" onclick="selectSpice('Hot', this)">
          <b>Hot</b><br />
          <small>Spicy heat</small>
        </button>

        <button class="spice-btn" onclick="selectSpice('Extra Hot', this)">
          <b>Extra Hot</b><br />
          <small>For brave souls</small>
        </button>
      </div>
    </div>

    <div class="order-summary">
      <div class="summary-header">
        <h3>Order Summary</h3>
      </div>

      <div class="summary-body">
        <p><b>Item:</b></p>
        <div id="cartItems"></div>
        <hr />

        <div class="price-row">
          <span>Subtotal:</span>
          <span id="subtotal">$0.00</span>
        </div>

        <div class="price-row">
          <span>Tax (8%)</span>
          <span id="tax">$0.00</span>
        </div>

        <div class="price-row total">
          <span>Total:</span>
          <span id="total">$0.00</span>
        </div>

        <div id="spiceDisplay">
          <strong>Spice Level:</strong>
          <span id="spiceSelected">None</span>
        </div>

        <button class="checkout-btn" onclick="goToCart()">Checkout</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showCategory('Proteins', this)">Proteins</button>
    <button class="tab-btn" onclick="showCategory('Vegetables', this)">Vegetables</button>
    <button class="tab-btn" onclick="showCategory('Noodles', this)">Noodles</button>
    <button class="tab-btn" onclick="showCategory('Drinks', this)">Drinks</button>
  </div>

  <div class="items-grid" id="itemsGrid"></div>

  <div class="see-more">
    <button class="see-more-btn">See more</button>
  </div>
</main>

<script src="Order_page.js"></script>
<script>
  window.onload = function () {

    const selectedItem = localStorage.getItem("selectedItem");

    if (selectedItem) {
        document.getElementById("selectedItem").innerText = selectedItem;

        // make sure cart exists
        if (typeof cart !== "undefined") {
            cart.push({
                name: selectedItem,
                price: 3.5,
                qty: 1
            });

            updateCart();
        }
    }
  };
  </script>
  <script>
  window.onload = function () {
  if (typeof cart === "undefined") {
    cart = [];
  }

  updateCart();};
  </script>

  <script>
  function goToCart() {
    window.location.href = "../Card-Page/Cart.html";
  }
  </script>
<script>
  const hamburger = document.getElementById("hamburger-menu");
  const sidebar = document.getElementById("sidebar-nav");
  const overlay = document.getElementById("sidebar-overlay");
  const closeBtn = document.getElementById("sidebar-close");

  function openSidebar() {
    sidebar.classList.add("open");
    overlay.classList.add("show");
    document.body.classList.add("no-scroll");
  }

  function closeSidebar() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
    document.body.classList.remove("no-scroll");
  }

  hamburger.addEventListener("click", openSidebar);
  closeBtn.addEventListener("click", closeSidebar);
  overlay.addEventListener("click", closeSidebar);
</script>

</body>
</html>
